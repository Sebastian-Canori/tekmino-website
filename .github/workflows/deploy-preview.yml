name: Deploy Preview to cPanel via SFTP

on:
  push:
    branches-ignore: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache-bust CSS/JS asset links
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          find . -maxdepth 1 -name "*.html" -print0 | xargs -0 sed -i \
            -E "s#(href=\"assets/css/[^\"]+\.css)\"#\1?v=${SHA_SHORT}\"#g; s#(src=\"assets/js/[^\"]+\.js)\"#\1?v=${SHA_SHORT}\"#g"

      - name: Deploy over SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USER }}
          server: ${{ secrets.SFTP_HOST }}
          ssh_private_key: ${{ secrets.SFTP_SSH_KEY }}
          port: 22
          sftp_only: true
          local_path: './*'
          remote_path: 'public_html/preview-${{ github.ref_name }}'
